name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholders: Prisma generate/typecheck/build nunca conectam num banco real, e os testes usam mocks.
  # Segredos reais vivem só na VPS (.env, nunca no CI).
  DATABASE_URL: postgresql://gastos:gastos@localhost:5433/gastos?schema=public
  SESSION_SECRET: ci-placeholder-secret-not-used-in-production-000000
  NEXT_PUBLIC_API_URL: /api

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api db:generate

      # 08-seguranca § 11: build vermelho em vulnerabilidade alta/crítica. Sem correção disponível ainda,
      # a decisão é explícita (registrada no TODO.md), nunca silenciar o alerta.
      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # "Teste unitário" do frontend (04-padroes-codigo § Testes): Cypress Component Testing.
  components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Cypress binary
        run: pnpm --filter web exec cypress install
      - name: Cypress component tests
        run: pnpm --filter web cy:run

  # Um Dockerfile quebrado só aparece no deploy. Construir as imagens no PR pega isso antes
  # (ex.: `prisma generate` na inicialização falhando para o usuário sem privilégios).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build

  # Só em push na main, depois que os outros jobs passaram — sem passo manual fora do CI
  # (09-operacao.md § 5). Precisa dos secrets DEPLOY_HOST/DEPLOY_USER/DEPLOY_SSH_KEY (e opcionalmente
  # DEPLOY_PATH, default abaixo) configurados no repositório. A VPS de hoje já roda outro app dono das
  # portas 80/443 (pdv-web) — por isso o `up` aqui nunca inclui o serviço `caddy` (nem o `--build` builda
  # a imagem dele, que não existe) e, depois de subir, roda scripts/connect-shared-network.sh para anexar
  # web/api na rede do Caddy do outro app (nunca via `networks:` do compose — ver comentário no script).
  # Rodando sozinho numa VPS nova, tirar essa chamada e incluir `caddy` no `up`.
  deploy:
    runs-on: ubuntu-latest
    needs: [ci, components, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false # nunca cancelar um deploy em andamento pra começar outro
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH || '/root/gastos-web' }}"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            ./scripts/deploy-check.sh
            docker compose up -d --build web api
            ./scripts/connect-shared-network.sh
            # --build sem limpeza deixa imagem/camada órfã a cada deploy.
            docker image prune -f
      - name: Wait for the API to answer /health
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd "${{ secrets.DEPLOY_PATH || '/root/gastos-web' }}"
            # api não publica porta nenhuma no host — checar de dentro do container é o mesmo que
            # fazíamos manualmente pra validar cada deploy.
            for i in $(seq 1 30); do
              docker compose exec -T api wget -qO- http://localhost:3001/health && exit 0
              sleep 2
            done
            echo "ERRO: /health não respondeu 200 depois do deploy" >&2
            exit 1
